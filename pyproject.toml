[project]
name = "new-biz-finder"
version = "0.1.0"
description = "Resumable pipeline that discovers recently funded seed-stage SaaS/AI startups and evaluates them as agency opportunities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scanner"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "reports", ".agents", "cloned_skills", "frontends"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in prose/docstrings
    "RUF002",
    "RUF003",
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
